name: Build CommitX APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

# Always build the newest commit; cancel superseded builds so the artifact
# always matches the latest Lovable changes pushed to GitHub.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  COMMITX_KEYSTORE_PATH: ${{ github.workspace }}/android/app/commitx.keystore
  COMMITX_KEYSTORE_PASSWORD: commitx
  COMMITX_KEY_ALIAS: commitx
  COMMITX_KEY_PASSWORD: commitx

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Show commit being built
        run: git log -1 --pretty='%H %ci %s'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses and install platform
        run: |
          set -eux
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" < /dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      # Keep one signing identity across CI runs so a newly downloaded APK can
      # update the previous build instead of requiring a fresh uninstall.
      - name: Restore APK signing identity
        uses: actions/cache@v4
        with:
          path: android/app/commitx.keystore
          key: commitx-apk-signing-v1

      - name: Generate signing keystore (non-interactive)
        run: |
          set -eux
          mkdir -p android/app
          if [ ! -f "$COMMITX_KEYSTORE_PATH" ]; then
            keytool -genkeypair -noprompt \
              -keystore "$COMMITX_KEYSTORE_PATH" \
              -alias "$COMMITX_KEY_ALIAS" \
              -storepass "$COMMITX_KEYSTORE_PASSWORD" \
              -keypass "$COMMITX_KEY_PASSWORD" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=CommitX, OU=Mobile, O=CommitX, L=NA, S=NA, C=IN"
          fi

      - name: Build signed release APK and AAB
        working-directory: android
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          COMMITX_VERSION_CODE: ${{ github.run_number }}
          COMMITX_VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace < /dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: commitx-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload AAB (Play Store upload format)
        uses: actions/upload-artifact@v4
        with:
          name: commitx-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error


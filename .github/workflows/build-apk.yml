name: Build CommitX APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Always build the newest commit; cancel superseded builds so the artifact
# always matches the latest Lovable changes pushed to GitHub.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  COMMITX_KEYSTORE_PATH: ${{ github.workspace }}/android/app/commitx.keystore
  COMMITX_KEYSTORE_PASSWORD: commitx
  COMMITX_KEY_ALIAS: commitx
  COMMITX_KEY_PASSWORD: commitx

  # Play Store version. This is the single place to change it.
  # Bump COMMITX_VERSION_CODE by 1 before every new upload — Play rejects an
  # upload whose version code is not higher than the last one it received.
  COMMITX_VERSION_CODE: "2"
  COMMITX_VERSION_NAME: "1.0.1"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Show commit being built
        run: git log -1 --pretty='%H %ci %s'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The GitHub Ubuntu runner already ships the Android SDK. Use it directly
      # (with a self-installed cmdline-tools fallback) instead of the
      # setup-android action, which intermittently fails on its own download.
      - name: Resolve Android SDK
        run: |
          set -eux
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/android-sdk}}"
          mkdir -p "$SDK_ROOT"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            for candidate in \
              "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
              "$SDK_ROOT/cmdline-tools/"*/bin/sdkmanager; do
              if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
            done
          fi
          if [ -z "$SDKMANAGER" ]; then
            TOOLS_ZIP="$RUNNER_TEMP/cmdline-tools.zip"
            for attempt in 1 2 3; do
              curl -fsSL --retry 3 --retry-all-errors \
                https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
                -o "$TOOLS_ZIP" && break
              sleep 5
            done
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            unzip -q "$TOOLS_ZIP" -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept SDK licenses and install platform
        run: |
          set -eux
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null || true
          for attempt in 1 2 3; do
            "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --install \
              "platform-tools" "platforms;android-36" "build-tools;36.0.0" < /dev/null && break
            sleep 10
          done


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1


      # Keep one signing identity across CI runs so a newly downloaded APK can
      # update the previous build instead of requiring a fresh uninstall.
      - name: Restore APK signing identity
        uses: actions/cache@v4
        with:
          path: android/app/commitx.keystore
          key: commitx-apk-signing-v1

      - name: Generate signing keystore (non-interactive)
        run: |
          set -eux
          mkdir -p android/app
          if [ ! -f "$COMMITX_KEYSTORE_PATH" ]; then
            keytool -genkeypair -noprompt \
              -keystore "$COMMITX_KEYSTORE_PATH" \
              -alias "$COMMITX_KEY_ALIAS" \
              -storepass "$COMMITX_KEYSTORE_PASSWORD" \
              -keypass "$COMMITX_KEY_PASSWORD" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=CommitX, OU=Mobile, O=CommitX, L=NA, S=NA, C=IN"
          fi

      - name: Build signed release APK and AAB
        working-directory: android
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace < /dev/null

      # Artifacts count against the GitHub Actions storage quota. Remove old
      # build artifacts first, then publish the files to a rolling GitHub
      # Release (releases do not use that quota) so downloads never fail.
      - name: Delete old build artifacts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '.artifacts[].id' | while read -r id; do
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
            done

      - name: Publish APK and AAB to the latest-build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/commitx-v${COMMITX_VERSION_NAME}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/commitx-v${COMMITX_VERSION_NAME}.aab"
          gh release delete latest-build --cleanup-tag -y --repo "${{ github.repository }}" || true
          gh release create latest-build dist/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "CommitX latest build (run ${{ github.run_number }})" \
            --notes "APK for direct install and AAB for Play Console. Built from ${{ github.sha }}."

      - name: Upload APK artifact (optional)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: commitx-apk-v${{ env.COMMITX_VERSION_NAME }}-run${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 1

      - name: Upload AAB artifact (optional)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: commitx-aab-run${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 1

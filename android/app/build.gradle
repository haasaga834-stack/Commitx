plugins {
    id "com.android.application"
}

def keystorePath = System.getenv("COMMITX_KEYSTORE_PATH") ?: "commitx.keystore"
def keystoreFile = file(keystorePath)

// Web (server) OAuth client ID used by native Google Sign-In.
// This is the project's public Web client ID (no secret) so the in-app Google
// account chooser works out of the box. Override at build time with:
// export GOOGLE_WEB_CLIENT_ID="xxxx.apps.googleusercontent.com"
def defaultGoogleWebClientId = "1071070006682-q095d7588gsb7ap7joh8t1p5ls3epvtj.apps.googleusercontent.com"
def googleWebClientId = System.getenv("GOOGLE_WEB_CLIENT_ID") ?: defaultGoogleWebClientId

tasks.register("validateReleaseSigning") {
    doLast {
        if (!keystoreFile.exists() || !System.getenv("COMMITX_KEYSTORE_PASSWORD") ||
                !System.getenv("COMMITX_KEY_ALIAS") || !System.getenv("COMMITX_KEY_PASSWORD")) {
            throw new GradleException("Release requires the original upload keystore and environment signing credentials. Debug signing is not allowed.")
        }
    }
}
tasks.configureEach { task ->
    if (task.name == "preReleaseBuild") task.dependsOn("validateReleaseSigning")
}

android {
    namespace "app.commitx.mobile"
    compileSdk 36

    defaultConfig {
        applicationId "app.commitx.mobile"
        minSdk 24
        targetSdk 36

        versionCode Integer.parseInt(System.getenv("COMMITX_VERSION_CODE") ?: "3")
        versionName System.getenv("COMMITX_VERSION_NAME") ?: "1.0.2"
        resourceConfigurations += ["en"]
        resValue "string", "google_web_client_id", googleWebClientId
    }


    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                // Release credentials must come from the build environment only.
                storePassword System.getenv("COMMITX_KEYSTORE_PASSWORD")
                keyAlias System.getenv("COMMITX_KEY_ALIAS")
                keyPassword System.getenv("COMMITX_KEY_PASSWORD")
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            debuggable false
            signingConfig signingConfigs.release
        }
    }

    bundle {
        language { enableSplit = false }
        density { enableSplit = true }
        abi { enableSplit = true }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation "androidx.browser:browser:1.8.0"
    implementation "androidx.credentials:credentials:1.3.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.3.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
    implementation "com.google.android.play:review:2.0.1"
}

plugins {
    id "com.android.application"
}

def keystorePath = System.getenv("COMMITX_KEYSTORE_PATH") ?: "commitx.keystore"
def keystoreFile = file(keystorePath)

// Web (server) OAuth client ID used by native Google Sign-In.
// Supply at build time: export GOOGLE_WEB_CLIENT_ID="xxxx.apps.googleusercontent.com"
def googleWebClientId = System.getenv("GOOGLE_WEB_CLIENT_ID") ?: ""

android {
    namespace "app.commitx.mobile"
    compileSdk 35

    defaultConfig {
        applicationId "app.commitx.mobile"
        minSdk 23
        targetSdk 35
        versionCode Integer.parseInt(System.getenv("COMMITX_VERSION_CODE") ?: "1")
        versionName System.getenv("COMMITX_VERSION_NAME") ?: "1.0.0"
        resourceConfigurations += ["en"]
        resValue "string", "google_web_client_id", googleWebClientId
    }


    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword System.getenv("COMMITX_KEYSTORE_PASSWORD") ?: "commitx"
                keyAlias System.getenv("COMMITX_KEY_ALIAS") ?: "commitx"
                keyPassword System.getenv("COMMITX_KEY_PASSWORD") ?: "commitx"
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            debuggable false
            signingConfig keystoreFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    bundle {
        language { enableSplit = false }
        density { enableSplit = true }
        abi { enableSplit = true }
    }

    lint {
        abortOnError false
    }
}

plugins {
    id "com.android.application"
}

def keystorePath = System.getenv("COMMITX_KEYSTORE_PATH") ?: "commitx.keystore"
def keystoreFile = file(keystorePath)

// Web (server) OAuth client ID used by native Google Sign-In.
// This is the project's public Web client ID (no secret) so the in-app Google
// account chooser works out of the box. Override at build time with:
// export GOOGLE_WEB_CLIENT_ID="xxxx.apps.googleusercontent.com"
def defaultGoogleWebClientId = "1071070006682-q095d7588gsb7ap7joh8t1p5ls3epvtj.apps.googleusercontent.com"
def googleWebClientId = System.getenv("GOOGLE_WEB_CLIENT_ID") ?: defaultGoogleWebClientId

android {
    namespace "app.commitx.mobile"
    compileSdk 36

    defaultConfig {
        applicationId "app.commitx.mobile"
        minSdk 23
        targetSdk 36

        versionCode Integer.parseInt(System.getenv("COMMITX_VERSION_CODE") ?: "1")
        versionName System.getenv("COMMITX_VERSION_NAME") ?: "1.0.0"
        resourceConfigurations += ["en"]
        resValue "string", "google_web_client_id", googleWebClientId
    }


    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword System.getenv("COMMITX_KEYSTORE_PASSWORD") ?: "commitx"
                keyAlias System.getenv("COMMITX_KEY_ALIAS") ?: "commitx"
                keyPassword System.getenv("COMMITX_KEY_PASSWORD") ?: "commitx"
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            debuggable false
            signingConfig keystoreFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    bundle {
        language { enableSplit = false }
        density { enableSplit = true }
        abi { enableSplit = true }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation "androidx.browser:browser:1.8.0"
    implementation "androidx.credentials:credentials:1.3.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.3.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
    implementation "com.google.android.play:review:2.0.1"
}
